# Architecture à deux brokers :
#   simulator -> mosquitto-edge (local) -> edge -> mosquitto-cloud -> cloud
#
# Scénario edge-cloud (par défaut) : EDGE_MODE=reduce  (flux réduit)
# Scénario cloud-only              : EDGE_MODE=forward (tout est envoyé au Cloud)
#
# Semaine 2 : InfluxDB (bloc commenté en bas)   Semaine 3 : Grafana

services:
  mosquitto-edge:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  mosquitto-cloud:
    image: eclipse-mosquitto:2
    ports:
      - "1884:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  simulator:
    build: ./simulator
    environment:
      MQTT_HOST: mosquitto-edge
      MQTT_PORT: 1883
      N_SENSORS: ${N_SENSORS:-1}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-2.0}
    depends_on:
      - mosquitto-edge

  edge:
    build: ./edge
    environment:
      LOCAL_HOST: mosquitto-edge
      LOCAL_PORT: 1883
      CLOUD_HOST: mosquitto-cloud
      CLOUD_PORT: 1883
      EDGE_MODE: ${EDGE_MODE:-reduce}
      EDGE_BATCH: ${EDGE_BATCH:-5}
    depends_on:
      - mosquitto-edge
      - mosquitto-cloud

  cloud:
    build: ./cloud
    environment:
      MQTT_HOST: mosquitto-cloud
      MQTT_PORT: 1883
      CLOUD_DELAY_SECONDS: ${CLOUD_DELAY_SECONDS:-0.2}
    depends_on:
      - mosquitto-cloud

