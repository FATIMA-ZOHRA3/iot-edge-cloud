version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883" # Port par défaut de MQTT
      - "9001:9001" # Port pour WebSockets (optionnel, mais utile plus tard)
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
  simulator:
    build: ./simulator
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      - mosquitto  
  cloud:
    build: ./cloud
    environment:
      MQTT_HOST: mosquitto
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: iot-token-dev
      INFLUX_ORG: ensah
      INFLUX_BUCKET: iot
    depends_on:
      - mosquitto
      - influxdb  
  edge:
    build: ./edge
    environment:
      MQTT_HOST: mosquitto
      EDGE_BATCH: 5
      ALERT_THRESHOLD: 32.0
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: iot-token-dev
      INFLUX_ORG: ensah
      INFLUX_BUCKET: iot
    depends_on:
      - mosquitto
      - influxdb
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: motdepasse-iot-2026
      DOCKER_INFLUXDB_INIT_ORG: ensah
      DOCKER_INFLUXDB_INIT_BUCKET: iot
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: iot-token-dev
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped

volumes:
  influxdb-data:
