version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883" # Port par défaut de MQTT
      - "9001:9001" # Port pour WebSockets (optionnel, mais utile plus tard)
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
  simulator:
    build: ./simulator
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      - mosquitto  
  cloud:
    build: ./cloud
    environment:
      MQTT_HOST: mosquitto
    depends_on:
      - mosquitto    
  edge:
    build: ./edge
    environment:
      MQTT_HOST: mosquitto
      EDGE_BATCH: 5
      ALERT_THRESHOLD: 32.0
    depends_on:
      - mosquitto